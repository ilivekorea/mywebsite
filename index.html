<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED 전광판</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #00ffcc;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 전광판 화면 */
        .marquee-stage {
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: inset 0 0 50px rgba(0, 255, 204, 0.2);
        }

        .marquee-text {
            display: inline-block;
            font-size: 15vw;
            font-weight: bold;
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
            white-space: nowrap;
            padding-left: 100vw;
            animation: marquee 10s linear infinite;
        }

        /* 오른쪽 -> 왼쪽 이동 */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* 하단 설정창 */
        .controls {
            background: #111;
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            border-top: 2px solid #333;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            width: 60%;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00ffcc;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 전광판 화면 -->
    <div class="marquee-stage">
        <div id="text" class="marquee-text">원하는 문장을 입력하세요!</div>
    </div>

    <!-- 하단 입력창 -->
    <div class="controls">
        <input type="text" id="input" value="원하는 문장을 입력하세요!">
        <button onclick="updateText()">문구 변경</button>
    </div>

    <script>
        function updateText() {
            const val = document.getElementById('input').value;
            document.getElementById('text').innerText = val;
        }
    </script>
</body>
</html>
